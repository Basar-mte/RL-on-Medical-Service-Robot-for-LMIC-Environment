    label: "Male Ward South Wall (left)"
  - polygon: [[9.0, 14.9], [17.9, 14.9], [17.9, 15.1], [9.0, 15.1]]
    label: "Male Ward South Wall (right)"

  # North wall (y=22): door gap x=[12.5,14.0] → opens to supply room
