  # ── MALE WARD boundary walls ──────────────────────────────────────────────
  # East wall (x=18): door gap y=[18.0,19.5] → opens to vertical corridor
  - polygon: [[17.9, 15.0], [18.1, 15.0], [18.1, 18.0], [17.9, 18.0]]
    label: "Male Ward East Wall (lower)"
  - polygon: [[17.9, 19.5], [18.1, 19.5], [18.1, 21.9], [17.9, 21.9]]
    label: "Male Ward East Wall (upper)"

  # South wall (y=15): door gap x=[7.5,9.0] → opens to horizontal corridor
