# LMIC-HospitalNav floor plan configuration
# Grounded in DMCH (Dhaka Medical College Hospital) context:
# ~2,600 beds at ~133% occupancy, ~5,000 OPD/day, 92 wards
# Scale: 40m x 30m representative ward floor
#
# Key LMIC realities modelled:
#  1. Overflow beds IN the corridors (primary navigation challenge)
#  2. Equipment carts and waiting benches in corridors
#  3. Extremely high pedestrian density (family attendants, patients, staff)
#  4. Gender-segregated wards
#  5. Prayer room (cultural constraint)

map:
  width_m: 40.0
  height_m: 30.0
  cell_size_m: 0.1

rooms:
  - id: main_corridor_h
    type: corridor
    polygon: [[0.0, 12.0], [40.0, 12.0], [40.0, 15.0], [0.0, 15.0]]
    cultural_zone: false
    urgency_level: 1
    default_pedestrian_density: 0.9
    label: "Main Horizontal Corridor"

  - id: main_corridor_v
    type: corridor
    polygon: [[18.0, 0.0], [22.0, 0.0], [22.0, 30.0], [18.0, 30.0]]
    cultural_zone: false
    urgency_level: 1
    default_pedestrian_density: 0.8
    label: "Main Vertical Corridor"

  - id: nurse_station
