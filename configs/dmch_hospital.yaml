    label: "Equipment Cart 3"

  # ═══════════════════════════════════════════════════════════════════════════
  # WARD BOUNDARY WALLS
  # Each ward is a fully enclosed room. Door gaps (1.5 m) align with the
  # central nursing corridor inside each ward.
  #
  # Ward internal layout (y direction, 7 m total):
  #   y=15.0–15.2  south wall
  #   y=15.2–16.8  south bed row  (8 official beds × 1.8 m)
  #   y=16.9–17.4  south Mejhe aisle  (floor patients on mattresses)
  #   y=17.5–19.5  CENTRAL NURSING CORRIDOR  (2 m clear — door gaps align here)
  #   y=19.6–20.1  north Mejhe aisle
  #   y=20.3–21.9  north bed row  (8 official beds × 1.8 m)
  #   y=21.9–22.0  north wall
