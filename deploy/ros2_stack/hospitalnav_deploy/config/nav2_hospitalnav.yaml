# Nav2 params for LMIC-HospitalNav hardware deployment.
# Global planner is Ackermann-aware (SmacPlannerHybrid). The local controller is
# the RL policy (controller_node), so controller_server is NOT used for driving —
# we bypass it via the path_to_waypoint bridge. A cultural costmap filter biases
# the GLOBAL plan away from prayer/gender zones.

amcl:
  ros__parameters:
    use_sim_time: false
    min_particles: 500
    max_particles: 2000
    laser_model_type: "likelihood_field"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"   # fine for localization
    z_hit: 0.5
    z_rand: 0.5

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.25
      motion_model_for_search: "DUBIN"
      minimum_turning_radius: 0.35    # WHEELBASE/tan(MAX_STEER)=0.20/tan(30deg)=0.35 m
      allow_unknown: false
      angle_quantization_bins: 72

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      robot_radius: 0.25              # ROBOT_RADIUS
      resolution: 0.05
      track_unknown_space: false
      plugins: ["static_layer", "obstacle_layer", "cultural_filter", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan: {topic: /scan, data_type: "LaserScan", max_obstacle_height: 2.0, clearing: true, marking: true}
      cultural_filter:                 # non-lethal cost over prayer/gender zones
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/cultural_filter_info"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

# Optional local costmap (used only if you later run a Nav2 controller plugin).
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      robot_radius: 0.25
      resolution: 0.05
      rolling_window: true
      width: 4
      height: 4
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan: {topic: /scan, data_type: "LaserScan", clearing: true, marking: true}
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45

# Cultural keepout filter mask metadata (a costmap_filter_info + a mask map server
# publish this). base=0, multiplier maps mask value -> added cost.
costmap_filter_info_server:
  ros__parameters:
    type: 0                 # keepout
    filter_info_topic: "/cultural_filter_info"
    mask_topic: "/cultural_mask"
    base: 0.0
    multiplier: 0.6         # non-lethal: discourage but do not forbid
